[tools]
uv = "latest"
goreleaser = "latest"
go = "1.26.3"

[settings]
lockfile = true
minimum_release_age = "7d"  # supply-chain: only versions >=7 days old

[tasks.install]
description = "Install dependencies"
run = "uv sync"

[tasks.test]
description = "Run the conformance + schema test suite"
run = "uv run pytest"

[tasks.gen]
description = "Generate Python type bindings from schemas (into .gen/, gitignored)"
run = '''
mkdir -p .gen/python
for t in envelope weight steps meal sleep; do
  uv run datamodel-codegen \
    --input "schemas/$t/1.json" \
    --input-file-type jsonschema \
    --output ".gen/python/$t.py" \
    --output-model-type pydantic_v2.BaseModel \
    --use-schema-description \
    --use-annotated \
    --disable-timestamp
done
'''

[tasks.typecheck]
description = "Type-check Python"
run = "uv run ty check"

[tasks.lint]
description = "Lint Python"
run = "uv run ruff check ."

[tasks.release-snapshot]
description = "GoReleaser をローカル乾式実行(タグ不要・公開なし)。dist/ に成果物を生成"
run = "goreleaser release --snapshot --clean --skip=sign"
